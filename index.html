<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Jorja &amp; Cameron | Wedding Photo &amp; Video Album</title>
  <meta name="description" content="Add your wedding photos and videos to Jorja and Cameron’s album.">
  <meta name="theme-color" content="#0A1F44">
  <link rel="icon" href="assets/cj-wreath.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Montserrat:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <main class="album-page">
    <section class="welcome-panel" aria-labelledby="coupleNames">
      <img class="floral-art floral-art-top" src="assets/invitation-roses.png" alt="" aria-hidden="true" fetchpriority="low" decoding="async">
      <img class="floral-art floral-art-bottom" src="assets/invitation-roses.png" alt="" aria-hidden="true" fetchpriority="low" decoding="async">
      <div class="welcome-content">
        <div class="monogram" aria-hidden="true">
          <img src="assets/cj-wreath.svg" alt="">
          <span>J&amp;C</span>
        </div>
        <p class="eyebrow">The wedding of</p>
        <h1 class="names" id="coupleNames">Jorja <span>&amp;</span> Cameron</h1>
        <p class="event-date"><span>Thursday</span><i aria-hidden="true"></i>10 June 2027</p>
        <div class="divider" aria-hidden="true"><span>✦</span></div>
        <p class="welcome-message">Thanks for <em>coming to our wedding!</em></p>
      </div>
    </section>

    <section class="upload-panel" aria-labelledby="uploadHeading">
      <p class="section-kicker">Our wedding album</p>
      <h2 id="uploadHeading">Share your photos <span>&amp; videos</span></h2>
      <p class="upload-intro">Got any photos or videos from the day? We’d love to see them.</p>

      <div class="file-input-wrapper">
        <label for="fileInput" class="custom-file-upload" id="fileLabel">
          <span class="upload-symbol" aria-hidden="true">
            <svg viewBox="0 0 24 24"><path d="M12 16V4m0 0L7.5 8.5M12 4l4.5 4.5"/><path d="M5 14v4.5A1.5 1.5 0 0 0 6.5 20h11a1.5 1.5 0 0 0 1.5-1.5V14"/></svg>
          </span>
          <span class="upload-copy">
            <span id="selectionLabel" aria-live="polite" aria-atomic="true">Choose photos and videos</span>
            <span class="upload-subtext">Choose from your phone or computer</span>
          </span>
          <span class="upload-chevron" aria-hidden="true">›</span>
        </label>
        <input type="file" id="fileInput" accept="image/*,video/*" multiple>
      </div>

      <button id="uploadButton" type="button" disabled>Add to our wedding album</button>
      <button id="retryButton" type="button" hidden>Try again</button>
      <div id="status" role="status" aria-live="polite"></div>
      <progress id="batchProgress" max="100" value="0" hidden aria-label="Files added to the album"></progress>
      <div id="activeUploads" aria-live="off"></div>
    </section>
  </main>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyDITfti6n6y1AJa7QGV5Z02_kJDCnCqJSfKiIVRH9KYoEbWda0xiaTXVVQ3RRhmSQUGw/exec";
    const MAX_PARALLEL_UPLOADS = 4;
    const CHUNK_SIZE = 8 * 1024 * 1024;
    const MAX_PHOTO_DIMENSION = 2000;
    const PHOTO_JPEG_QUALITY = 0.84;

    const fileInput = document.getElementById('fileInput');
    const selectionLabel = document.getElementById('selectionLabel');
    const uploadButton = document.getElementById('uploadButton');
    const retryButton = document.getElementById('retryButton');
    const statusElement = document.getElementById('status');
    const batchProgress = document.getElementById('batchProgress');
    const activeUploads = document.getElementById('activeUploads');
    let retryQueue = [];
    let currentBatch = [];
    let isUploading = false;

    fileInput.addEventListener('change', updateSelection);
    uploadButton.addEventListener('click', uploadSelectedFiles);
    retryButton.addEventListener('click', retryFailedFiles);

    function updateSelection() {
      const files = Array.from(fileInput.files || []);
      if (!files.length) {
        selectionLabel.textContent = 'Choose photos and videos';
      } else {
        const photos = files.filter(file => getMimeType(file).startsWith('image/')).length;
        const videos = files.length - photos;
        const parts = [];
        if (photos) parts.push(`${photos} photo${photos === 1 ? '' : 's'}`);
        if (videos) parts.push(`${videos} video${videos === 1 ? '' : 's'}`);
        selectionLabel.textContent = `${files.length} file${files.length === 1 ? '' : 's'} selected (${parts.join(', ')})`;
      }
      updateControls();
    }

    function updateControls() {
      fileInput.disabled = isUploading;
      fileInput.parentElement.classList.toggle('is-disabled', isUploading);
      uploadButton.disabled = isUploading || !fileInput.files || fileInput.files.length === 0;
      retryButton.disabled = isUploading || retryQueue.length === 0;
      retryButton.hidden = retryQueue.length === 0;
      retryButton.textContent = retryQueue.some(record => record.status === 'uncertain')
        ? 'Check uploads and retry'
        : 'Try again';
    }

    async function uploadSelectedFiles() {
      const files = Array.from(fileInput.files || []);
      if (!files.length) {
        statusElement.textContent = 'Choose a photo or video first.';
        return;
      }
      const uploadIds = await createUploadIds(files);
      currentBatch = files.map((file, index) => ({
        file,
        uploadId: uploadIds[index].uploadId,
        checkExisting: uploadIds[index].checkExisting,
        status: 'queued'
      }));
      retryQueue = [];
      batchProgress.value = 0;
      await runUploadBatch(currentBatch);
      fileInput.value = '';
      updateSelection();
    }

    async function retryFailedFiles() {
      const pending = retryQueue.slice();
      if (pending.length) await runUploadBatch(pending);
    }

    async function runUploadBatch(records) {
      if (isUploading) return;
      isUploading = true;
      updateControls();
      activeUploads.replaceChildren();
      batchProgress.hidden = false;
      let nextIndex = 0;

      function updateBatchStatus() {
        const added = currentBatch.filter(record => record.status === 'success').length;
        const needsRetry = currentBatch.filter(record => record.status === 'failed').length;
        const needsCheck = currentBatch.filter(record => record.status === 'uncertain').length;
        const uploading = currentBatch.filter(record => record.status === 'uploading').length;
        const waiting = currentBatch.filter(record => record.status === 'queued').length;
        batchProgress.value = currentBatch.length ? Math.round((added / currentBatch.length) * 100) : 0;
        const fileWord = currentBatch.length === 1 ? 'file' : 'files';
        const statusParts = [`${added} of ${currentBatch.length} ${fileWord} added`];
        if (uploading) statusParts.push(`${uploading} uploading`);
        if (waiting) statusParts.push(`${waiting} waiting`);
        if (needsRetry) statusParts.push(needsRetry === 1 ? '1 file needs a retry' : `${needsRetry} files need a retry`);
        if (needsCheck) statusParts.push(needsCheck === 1 ? '1 upload needs checking' : `${needsCheck} uploads need checking`);
        statusElement.textContent = statusParts.join(' · ');
      }

      function createUploadRow(record) {
        const row = document.createElement('div');
        row.className = 'upload-item';
        const name = document.createElement('div');
        name.className = 'upload-name';
        name.textContent = record.preparedName || record.file.name;
        const progress = document.createElement('progress');
        progress.max = 100;
        progress.value = 0;
        progress.setAttribute('aria-label', `${record.file.name} upload progress`);
        const detail = document.createElement('div');
        detail.className = 'upload-detail';
        detail.textContent = 'Preparing…';
        row.append(name, progress, detail);
        activeUploads.appendChild(row);
        return { element: row, name, progress, detail };
      }

      async function worker() {
        while (nextIndex < records.length) {
          const record = records[nextIndex++];
          record.status = 'uploading';
          const row = createUploadRow(record);
          updateBatchStatus();
          try {
            const prepared = record.prepared || await prepareMedia(record.file);
            record.prepared = prepared;
            record.preparedName = prepared.name;
            row.name.textContent = prepared.name;
            row.detail.textContent = `Uploading ${formatBytes(prepared.blob.size)}…`;

            await uploadToDrive(
              record,
              prepared.blob,
              prepared.name,
              prepared.mimeType,
              (loaded, total) => {
                row.progress.value = total ? Math.min(100, (loaded / total) * 100) : 0;
                row.detail.textContent = `Uploading ${formatBytes(loaded)} of ${formatBytes(total)} (${Math.floor(row.progress.value)}%)`;
              },
              message => { row.detail.textContent = message; }
            );

            record.status = 'success';
            record.prepared = null;
            record.sessionUri = '';
            retryQueue = retryQueue.filter(item => item !== record);
            row.progress.value = 100;
            row.detail.textContent = 'It’s in the album!';
          } catch (error) {
            console.error('Upload failed:', record.file.name, error);
            record.status = error.uncertain ? 'uncertain' : 'failed';
            record.error = error.message || 'Upload failed';
            if (!retryQueue.includes(record)) retryQueue.push(record);
            row.element.classList.add(error.uncertain ? 'is-uncertain' : 'is-failed');
            row.detail.textContent = error.uncertain
              ? `${record.error} Don’t choose this file again yet.`
              : `Didn’t upload: ${record.error}`;
          } finally {
            if (record.status === 'success') row.element.remove();
            updateBatchStatus();
          }
        }
      }

      await Promise.all(Array.from({ length: Math.min(MAX_PARALLEL_UPLOADS, records.length) }, () => worker()));
      isUploading = false;
      updateControls();

      if (retryQueue.length) {
        const added = currentBatch.filter(record => record.status === 'success').length;
        const failedCount = retryQueue.filter(record => record.status === 'failed').length;
        const uncertainCount = retryQueue.filter(record => record.status === 'uncertain').length;
        const fileWord = currentBatch.length === 1 ? 'file' : 'files';
        const statusParts = [`${added} of ${currentBatch.length} ${fileWord} added`];
        if (uncertainCount) {
          statusParts.push(`${uncertainCount} upload${uncertainCount === 1 ? '' : 's'} couldn’t be confirmed — check the album before choosing those files again`);
        }
        if (failedCount) {
          statusParts.push(failedCount === 1 ? '1 file needs a retry' : `${failedCount} files need a retry`);
        }
        statusElement.textContent = statusParts.join('. ') + '.';
      } else {
        statusElement.textContent = currentBatch.length === 1
          ? 'Thanks — it’s in the album!'
          : 'Thanks — all your photos and videos are in the album!';
      }
    }

    async function prepareMedia(file) {
      const originalMimeType = getMimeType(file);
      if (!originalMimeType.startsWith('image/') || originalMimeType === 'image/gif' || originalMimeType === 'image/svg+xml') {
        return { blob: file, name: file.name, mimeType: originalMimeType };
      }

      try {
        const image = await loadImage(file);
        const longestSide = Math.max(image.naturalWidth, image.naturalHeight);
        const scale = Math.min(1, MAX_PHOTO_DIMENSION / longestSide);
        const width = Math.max(1, Math.round(image.naturalWidth * scale));
        const height = Math.max(1, Math.round(image.naturalHeight * scale));
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext('2d', { alpha: false });
        if (!context) throw new Error('Photo optimisation is not supported by this browser.');
        context.fillStyle = '#fff';
        context.fillRect(0, 0, width, height);
        context.drawImage(image, 0, 0, width, height);

        const blob = await new Promise((resolve, reject) => {
          canvas.toBlob(result => result ? resolve(result) : reject(new Error('Could not optimise this photo.')), 'image/jpeg', PHOTO_JPEG_QUALITY);
        });
        const name = file.name.replace(/\.[^/.]+$/, '') + '.jpg';
        return { blob, name, mimeType: blob.type || 'image/jpeg' };
      } catch (error) {
        // If the phone browser cannot decode a format such as HEIC, keep and upload the original.
        console.info('Keeping the original image format:', file.name, error);
        return { blob: file, name: file.name, mimeType: originalMimeType };
      }
    }

    function loadImage(file) {
      return new Promise((resolve, reject) => {
        const objectUrl = URL.createObjectURL(file);
        const image = new Image();
        image.onload = () => {
          URL.revokeObjectURL(objectUrl);
          resolve(image);
        };
        image.onerror = () => {
          URL.revokeObjectURL(objectUrl);
          reject(new Error('This image format could not be decoded.'));
        };
        image.src = objectUrl;
      });
    }

    function getMimeType(file) {
      if (file.type) return file.type.toLowerCase();
      const extension = file.name.split('.').pop().toLowerCase();
      const types = {
        jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', gif: 'image/gif', webp: 'image/webp',
        heic: 'image/heic', heif: 'image/heif', tif: 'image/tiff', tiff: 'image/tiff',
        mp4: 'video/mp4', m4v: 'video/x-m4v', mov: 'video/quicktime', webm: 'video/webm', '3gp': 'video/3gpp'
      };
      return types[extension] || 'application/octet-stream';
    }

    async function uploadToDrive(record, blob, name, mimeType, onProgress, onStatus) {
      let sessionUri = record.sessionUri || '';
      let offset = 0;
      let recoveryAttempts = 0;

      if (sessionUri) {
        onStatus('Checking the previous attempt before continuing…');
        const state = await checkUploadSession(sessionUri, blob.size, record.uploadId);
        if (state.complete) {
          onProgress(blob.size, blob.size);
          record.sessionUri = '';
          return state.file || null;
        }
        if (state.expired) {
          record.sessionUri = '';
          const started = await createUploadSession(record, name, mimeType, blob.size);
          if (started.complete) {
            onProgress(blob.size, blob.size);
            return started.file || null;
          }
          sessionUri = started.sessionUri;
          record.sessionUri = sessionUri;
        } else {
          offset = state.nextOffset || 0;
          onProgress(offset, blob.size);
        }
      } else {
        const started = await createUploadSession(record, name, mimeType, blob.size);
        if (started.complete) {
          onProgress(blob.size, blob.size);
          return started.file || null;
        }
        sessionUri = started.sessionUri;
        record.sessionUri = sessionUri;
      }

      while (offset < blob.size) {
        const end = Math.min(offset + CHUNK_SIZE, blob.size);
        try {
          const response = await putChunk(sessionUri, blob, offset, end, onProgress);
          if (response.status === 200 || response.status === 201) {
            onProgress(blob.size, blob.size);
            record.sessionUri = '';
            return response.body;
          }

          offset = response.nextOffset > offset ? response.nextOffset : end;
          recoveryAttempts = 0;
          onProgress(offset, blob.size);
          if (offset >= blob.size) {
            const state = await checkUploadSession(sessionUri, blob.size, record.uploadId);
            if (state.complete) {
              record.sessionUri = '';
              return state.file || null;
            }
            if (state.expired) {
              record.sessionUri = '';
              const started = await createUploadSession(record, name, mimeType, blob.size);
              if (started.complete) {
                onProgress(blob.size, blob.size);
                return started.file || null;
              }
              sessionUri = started.sessionUri;
              record.sessionUri = sessionUri;
              offset = 0;
            } else {
              offset = state.nextOffset || 0;
              if (offset >= blob.size) {
                const uncertainError = new Error('We couldn’t confirm whether this made it to the album. Check the album before choosing it again.');
                uncertainError.uncertain = true;
                throw uncertainError;
              }
            }
          }
        } catch (error) {
          if (error.uncertain) throw error;
          if (!isRetryable(error) && error.status !== 404) throw error;
          recoveryAttempts++;
          onStatus('The connection dropped. Checking what got through…');
          await wait(500 * recoveryAttempts);

          const state = await checkUploadSession(sessionUri, blob.size, record.uploadId);
          if (state.complete) {
            onProgress(blob.size, blob.size);
            record.sessionUri = '';
            return state.file || null;
          }
          if (state.expired) {
            record.sessionUri = '';
            const started = await createUploadSession(record, name, mimeType, blob.size);
            if (started.complete) {
              onProgress(blob.size, blob.size);
              return started.file || null;
            }
            sessionUri = started.sessionUri;
            record.sessionUri = sessionUri;
            offset = 0;
          } else {
            offset = state.nextOffset || 0;
          }
          if (recoveryAttempts > 4) {
            throw new Error('The connection keeps dropping. Try again in a moment.');
          }
        }
      }
    }

    async function createUploadSession(record, name, mimeType, size) {
      const response = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
        body: JSON.stringify({
          action: 'initiateUpload',
          uploadId: record.uploadId,
          checkExisting: Boolean(record.checkExisting),
          name,
          mimeType,
          size
        })
      });
      const result = await response.json();
      if (!response.ok || result.result !== 'success' || (!result.complete && !result.sessionUri)) {
        throw new Error(result.error || 'We couldn’t start the upload. Try again.');
      }
      record.checkExisting = true;
      return result;
    }

    function putChunk(sessionUri, file, start, end, onProgress) {
      return new Promise((resolve, reject) => {
        const xhr = new XMLHttpRequest();
        xhr.open('PUT', sessionUri, true);
        xhr.setRequestHeader('Content-Type', file.type || 'application/octet-stream');
        xhr.setRequestHeader('Content-Range', `bytes ${start}-${end - 1}/${file.size}`);
        xhr.upload.onprogress = event => {
          if (event.lengthComputable) onProgress(start + event.loaded, file.size);
        };
        xhr.onload = () => {
          if (xhr.status === 308) {
            resolve({ status: 308, nextOffset: getNextOffset(xhr, start) });
          } else if (xhr.status === 200 || xhr.status === 201) {
            resolve({ status: xhr.status, body: parseJsonResponse(xhr.responseText) });
          } else {
            reject(makeUploadError(xhr));
          }
        };
        xhr.onerror = () => reject(new Error('Connection lost while uploading.'));
        xhr.onabort = () => reject(new Error('The upload stopped.'));
        xhr.send(file.slice(start, end));
      });
    }

    async function checkUploadSession(sessionUri, size, uploadId) {
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'text/plain;charset=UTF-8' },
          body: JSON.stringify({ action: 'checkUpload', sessionUri, uploadId, size }),
          cache: 'no-store'
        });
        const result = await response.json();
        if (!response.ok || result.result !== 'success') {
          const unsupported = /unsupported request/i.test(result.error || '');
          const message = unsupported
            ? 'The upload checker needs its Apps Script update. The file may already be in the album; check there before choosing it again.'
            : 'We couldn’t confirm whether this made it to the album. Check the album before choosing it again.';
          const error = new Error(message);
          error.uncertain = true;
          throw error;
        }
        return result;
      } catch (error) {
        if (error.uncertain) throw error;
        const uncertainError = new Error('We couldn’t confirm whether this made it to the album. Check the album before choosing it again.');
        uncertainError.uncertain = true;
        uncertainError.cause = error;
        throw uncertainError;
      }
    }

    async function createUploadIds(files) {
      const sessionId = getUploadSessionId();
      const occurrences = new Map();
      return Promise.all(files.map(async file => {
        const fingerprint = `${file.name}\u0000${file.size}\u0000${file.lastModified}\u0000${file.type}`;
        const occurrence = occurrences.get(fingerprint) || 0;
        occurrences.set(fingerprint, occurrence + 1);
        const seed = `${sessionId}\u0000${fingerprint}\u0000${occurrence}`;
        let uploadId;
        try {
          if (window.crypto && crypto.subtle && window.TextEncoder) {
            const digest = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(seed));
            uploadId = Array.from(new Uint8Array(digest).slice(0, 16), byte => byte.toString(16).padStart(2, '0')).join('');
          }
        } catch (error) {
          console.info('Using a temporary upload reference for this file.');
        }
        uploadId = uploadId || makeRandomUploadId();
        return { uploadId, checkExisting: registerUploadId(uploadId) };
      }));
    }

    function registerUploadId(uploadId) {
      const key = `camjorja-upload-started-${uploadId}`;
      try {
        const wasUsed = sessionStorage.getItem(key) === '1';
        sessionStorage.setItem(key, '1');
        return wasUsed;
      } catch (error) {
        return false;
      }
    }

    let uploadSessionId;
    function getUploadSessionId() {
      if (uploadSessionId) return uploadSessionId;
      try {
        uploadSessionId = sessionStorage.getItem('camjorja-upload-session-id');
        if (!uploadSessionId) {
          uploadSessionId = makeRandomUploadId();
          sessionStorage.setItem('camjorja-upload-session-id', uploadSessionId);
        }
      } catch (error) {
        uploadSessionId = makeRandomUploadId();
      }
      return uploadSessionId;
    }

    function makeRandomUploadId() {
      const bytes = new Uint8Array(16);
      if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(bytes);
      else for (let index = 0; index < bytes.length; index++) bytes[index] = Math.floor(Math.random() * 256);
      return Array.from(bytes, byte => byte.toString(16).padStart(2, '0')).join('');
    }

    function getNextOffset(xhr, fallback) {
      const range = xhr.getResponseHeader('Range');
      const match = range && range.match(/bytes=0-(\d+)/i);
      return match ? Number(match[1]) + 1 : fallback;
    }

    function makeUploadError(xhr) {
      const response = parseJsonResponse(xhr.responseText);
      const message = response && response.error && response.error.message
        ? response.error.message
        : 'Google Drive couldn’t save this file.';
      const error = new Error(message);
      error.status = xhr.status;
      return error;
    }

    function parseJsonResponse(text) {
      try { return text ? JSON.parse(text) : null; } catch (error) { return null; }
    }

    function isRetryable(error) {
      return !error.status || error.status === 429 || error.status >= 500;
    }

    function wait(milliseconds) {
      return new Promise(resolve => setTimeout(resolve, milliseconds));
    }

    function formatBytes(bytes) {
      if (!bytes) return '0 B';
      const units = ['B', 'KB', 'MB', 'GB'];
      const index = Math.min(Math.floor(Math.log(bytes) / Math.log(1024)), units.length - 1);
      return `${(bytes / Math.pow(1024, index)).toFixed(index ? 1 : 0)} ${units[index]}`;
    }
  </script>
</body>
</html>
