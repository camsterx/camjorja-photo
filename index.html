<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Your Moments - Cameron & Jorja</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap');

    :root {
      --outer-bg: #0A1F44;            
      --card-pastel-yellow: #FAF0D7;  
      --navy-blue: #0A1F44;          
      --border-navy: #122B5C;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--outer-bg);
      font-family: 'Cinzel', serif;
      color: var(--navy-blue);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background-color: var(--card-pastel-yellow);
      border: 2px solid var(--border-navy);
      border-radius: 8px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
    }

    .names {
      font-family: 'Alex Brush', cursive;
      font-size: 3.2rem;
      color: var(--navy-blue);
      margin: 0 0 5px 0;
      line-height: 1.1;
    }

    .subtitle {
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--navy-blue);
      margin-bottom: 20px;
    }

    p {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      color: var(--navy-blue);
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .divider {
      width: 60%;
      height: 1px;
      background-color: var(--navy-blue);
      margin: 15px auto 25px auto;
    }

    .file-input-wrapper {
      margin-bottom: 20px;
    }

    input[type="file"] {
      display: none;
    }

    .custom-file-upload {
      border: 2px dashed var(--navy-blue);
      display: block;
      padding: 22px 15px;
      cursor: pointer;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.4);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      color: var(--navy-blue);
      transition: background 0.3s, border-color 0.3s;
    }

    .custom-file-upload:hover {
      background: rgba(255, 255, 255, 0.8);
    }

    button {
      background-color: var(--navy-blue);
      color: var(--card-pastel-yellow);
      border: 2px solid var(--navy-blue);
      padding: 14px 30px;
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(10, 31, 68, 0.15);
    }

    button:hover {
      background-color: var(--card-pastel-yellow);
      color: var(--navy-blue);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(10, 31, 68, 0.2);
    }

    #status {
      margin-top: 20px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      color: var(--navy-blue);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="names">Cameron & Jorja</div>
    <div class="subtitle">Wedding Photos & Videos</div>
    
    <div class="divider"></div>

    <p>Upload your photos and clips from the day to share them directly with us!</p>
    
    <div class="file-input-wrapper">
      <label for="fileInput" class="custom-file-upload" id="fileLabel">
        Tap here to select photos
      </label>
      <input type="file" id="fileInput" accept="image/*,video/*" multiple>
    </div>

    <button onclick="uploadFiles()">Upload Photos</button>
    <div id="status"></div>
  </div>

  <script>
    // Your pre-configured Web App URL linked to your "Jorja&Cameron" folder
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyDITfti6n6y1AJa7QGV5Z02_kJDCnCqJSfKiIVRH9KYoEbWda0xiaTXVVQ3RRhmSQUGw/exec";

    document.getElementById('fileInput').addEventListener('change', function(e) {
      const count = e.target.files.length;
      document.getElementById('fileLabel').innerText = count > 0 
        ? `${count} file(s) selected` 
        : 'Tap here to select photos';
    });

    async function uploadFiles() {
      const fileInput = document.getElementById('fileInput');
      const status = document.getElementById('status');
      const files = fileInput.files;

      if (files.length === 0) {
        status.innerText = "Please select at least one photo first.";
        return;
      }

      status.innerText = "Uploading... Please wait.";

      for (let i = 0; i < files.length; i++) {
        const file = files[i];
        status.innerText = `Uploading file ${i + 1} of ${files.length}...`;

        try {
          const base64 = await convertToBase64(file);
          const payload = {
            name: file.name,
            type: file.type,
            base64: base64.split(',')[1]
          };

          await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
        } catch (err) {
          console.error(err);
          status.innerText = `Error uploading ${file.name}`;
          return;
        }
      }

      status.innerText = "Thank you! All photos uploaded successfully.";
      fileInput.value = "";
      document.getElementById('fileLabel').innerText = 'Tap here to select photos';
    }

    function convertToBase64(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
