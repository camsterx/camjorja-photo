<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Your Moments - Cameron & Jorja</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Alex+Brush&family=Cinzel:wght@400;600;700&family=Montserrat:wght@300;400;500;600&display=swap');

    :root {
      --outer-bg: #0A1F44;            
      --card-pastel-yellow: #FAF0D7;  
      --navy-blue: #0A1F44;          
      --border-navy: #122B5C;
    }

    body {
      margin: 0;
      padding: 20px;
      background-color: var(--outer-bg);
      font-family: 'Cinzel', serif;
      color: var(--navy-blue);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      box-sizing: border-box;
    }

    .card {
      background-color: var(--card-pastel-yellow);
      border: 2px solid var(--border-navy);
      border-radius: 8px;
      padding: 40px 30px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      box-sizing: border-box;
    }

    .names {
      font-family: 'Alex Brush', cursive;
      font-size: 3.2rem;
      color: var(--navy-blue);
      margin: 0 0 5px 0;
      line-height: 1.1;
    }

    .subtitle {
      font-size: 0.8rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--navy-blue);
      margin-bottom: 20px;
    }

    p {
      font-family: 'Montserrat', sans-serif;
      font-size: 0.9rem;
      color: var(--navy-blue);
      line-height: 1.5;
      margin-bottom: 25px;
    }

    .divider {
      width: 60%;
      height: 1px;
      background-color: var(--navy-blue);
      margin: 15px auto 25px auto;
    }

    .file-input-wrapper {
      margin-bottom: 20px;
    }

    input[type="file"] {
      display: none;
    }

    .custom-file-upload {
      border: 2px dashed var(--navy-blue);
      display: block;
      padding: 22px 15px;
      cursor: pointer;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.4);
      font-family: 'Montserrat', sans-serif;
      font-size: 0.95rem;
      color: var(--navy-blue);
      transition: background 0.3s, border-color 0.3s;
    }

    .custom-file-upload:hover {
      background: rgba(255, 255, 255, 0.8);
    }

    button {
      background-color: var(--navy-blue);
      color: var(--card-pastel-yellow);
      border: 2px solid var(--navy-blue);
      padding: 14px 30px;
      font-family: 'Cinzel', serif;
      font-size: 0.95rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      font-weight: 600;
      border-radius: 4px;
      cursor: pointer;
      width: 100%;
      transition: all 0.3s ease;
      box-shadow: 0 4px 6px rgba(10, 31, 68, 0.15);
    }

    button:hover {
      background-color: var(--card-pastel-yellow);
      color: var(--navy-blue);
      transform: translateY(-2px);
      box-shadow: 0 6px 12px rgba(10, 31, 68, 0.2);
    }

    #status {
      margin-top: 20px;
      font-family: 'Montserrat', sans-serif;
      font-size: 0.85rem;
      color: var(--navy-blue);
      font-weight: 500;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="names">Cameron & Jorja</div>
    <div class="subtitle">Wedding Photos</div>
    
    <div class="divider"></div>

    <p>Upload your photos from the day to share them directly with us!</p>
    
    <div class="file-input-wrapper">
      <label for="fileInput" class="custom-file-upload" id="fileLabel">
        Tap here to select photos
      </label>
      <input type="file" id="fileInput" accept="image/*" multiple>
    </div>

    <button onclick="uploadFiles()">Upload Photos</button>
    <div id="status"></div>
  </div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbyDITfti6n6y1AJa7QGV5Z02_kJDCnCqJSfKiIVRH9KYoEbWda0xiaTXVVQ3RRhmSQUGw/exec";

    const fileInput = document.getElementById('fileInput');

    fileInput.addEventListener('change', function(e) {
      const count = e.target.files.length;
      document.getElementById('fileLabel').innerText = count > 0 
        ? `${count} photo(s) selected` 
        : 'Tap here to select photos';
    });

    async function uploadFiles() {
      const status = document.getElementById('status');
      const files = fileInput.files;

      if (files.length === 0) {
        status.innerText = "Please select at least one photo first.";
        return;
      }

      let successCount = 0;

      for (let i = 0; i < files.length; i++) {
        const file = files[i];

        status.innerText = `Optimising & uploading ${i + 1} of ${files.length}...`;

        try {
          // Compress photo locally on guest's device (converts Live Photos/HEIC to compressed JPEG)
          const compressedBase64 = await compressPhoto(file);
          
          // Ensure clean .jpg extension
          const cleanName = file.name.replace(/\.[^/.]+$/, "") + ".jpg";

          const payload = {
            name: cleanName,
            type: "image/jpeg",
            base64: compressedBase64.split(',')[1]
          };

          await fetch(SCRIPT_URL, {
            method: 'POST',
            body: JSON.stringify(payload)
          });

          successCount++;
        } catch (err) {
          console.error(err);
          status.innerText = `Error uploading photo ${i + 1}`;
          return;
        }
      }

      status.innerText = `Success! ${successCount} photo(s) added to the album.`;
      fileInput.value = "";
      document.getElementById('fileLabel').innerText = 'Tap here to select photos';
    }

    // Uses HTML Canvas to flatten Live Photos & scale down file sizes under 1MB
    function compressPhoto(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(e) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            
            const MAX_DIM = 2000; // 2000px provides crisp print quality while keeping file size under 1MB

            if (width > height) {
              if (width > MAX_DIM) {
                height = Math.round(height * (MAX_DIM / width));
                width = MAX_DIM;
              }
            } else {
              if (height > MAX_DIM) {
                width = Math.round(width * (MAX_DIM / height));
                height = MAX_DIM;
              }
            }

            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            // Compress to JPEG at 85% quality
            const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
            resolve(dataUrl);
          };
          img.onerror = reject;
          img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }
  </script>
</body>
</html>
